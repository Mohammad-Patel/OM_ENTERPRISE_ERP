{#-
  Print engine - OM Enterprise ERP
  Place at:  app/templates/components/print_engine.html
  Use at the END of <body> of a print template:   {% include 'components/print_engine.html' %}
-#}
<style>
/* ======================= Print engine (sheet mechanics) ======================= */
@page { size: A4 portrait; margin: 0; }

.dens-normal  { --fs: 1;    --pad: 1; }
.dens-compact { --fs: .95; --pad: .5; }
.dens-tight   { --fs: .9;  --pad: .22; }
.dens-compact .terms ol, .dens-tight .terms ol { columns: 2; column-gap: 8mm; }
.dens-compact .terms li, .dens-tight .terms li { break-inside: avoid; }

html.js .doc-src { position: absolute; left: -10000px; top: 0; width: 190mm; visibility: hidden; pointer-events: none; display: flex; flex-direction: column; }
html.js .doc-src > * { flex: none; }
html:not(.js) .doc-src { width: 210mm; max-width: 100%; margin: 10px auto; padding: 8mm 10mm; background: #fff; }
html:not(.js) [data-part="run"] { display: none; }

#sheets { padding: 10px 0 4px; }
.sheet { width: 210mm; height: 297mm; margin: 0 auto 10px; padding: 8mm 10mm 0; background: #fff; outline: 1px solid #94a3b8; box-shadow: 0 4px 14px rgba(15,23,42,.15); display: flex; flex-direction: column; position: relative; overflow: hidden; box-sizing: border-box; break-after: page; page-break-after: always; }
.sheet-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.sheet-body > * { flex: none; }
.sheet-body > .footer { margin-top: auto; }

/* Footer without top border and without challan number */
.sheet-foot { flex: none; height: 8mm; display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: none; font-size: 7.5pt; color: #64748b; }
.sheet-foot .cont { font-style: italic; }
.sheet-foot b { color: #0f172a; }

.run-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-bottom: 2px solid #0f172a; padding-bottom: 2mm; margin-bottom: 3mm; font-size: 8.5pt; color: #0f172a; }
.run-head b { font-weight: 800; }
.run-head .rh-mid { flex: 1; text-align: center; color: #334155; }
.run-head .rh-right { white-space: nowrap; font-weight: 700; }
.run-head i { font-style: normal; }

.carry-row td { font-weight: 700; font-style: italic; background: #f8fafc; font-size: calc(8.5px * var(--fs, 1)); padding: calc(4px * var(--pad, 1)) 8px; border-top: 1px dashed #64748b; }

.pe-info { display: inline-flex; align-items: center; gap: 8px; color: #334155; font-size: 9pt; font-weight: 600; }
.pe-info select { padding: 7px 8px; border: 1px solid #94a3b8; border-radius: 6px; font-size: 9pt; background: #fff; }

@media print {
  html, body { background: #fff !important; }
  #sheets { padding: 0; zoom: 1 !important; }
  .sheet { margin: 0; outline: none; box-shadow: none; height: 296.4mm; }
  .sheet:last-child { break-after: auto; page-break-after: auto; }
  .print-actions, .toolbar, .pe-info { display: none !important; }
}
</style>

<script>
(function () {
'use strict';
var MIN_TAIL = 3, MAX_TRIES = 16, DENS = ['normal', 'compact', 'tight'];
var DENS_NAME = {normal: 'normal spacing', compact: 'compact spacing', tight: 'extra compact spacing'};
var doc = document.getElementById('doc'), host = document.getElementById('sheets');
if (!doc || !host) { return; }
var mode = 'auto', safety = 0;

function sum(a, f) { var s = 0; a.forEach(function (x) { s += f(x); }); return s; }
function outerH(el) {
    var r = el.getBoundingClientRect(), cs = getComputedStyle(el);
    return r.height + (parseFloat(cs.marginTop) || 0) + (parseFloat(cs.marginBottom) || 0);
}
function numAttr(el, n) { var v = parseFloat((el.getAttribute(n) || '').replace(/,/g, '')); return isNaN(v) ? 0 : v; }
function inr(x) { return Number(x).toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
function mk(tag, cls) { var e = document.createElement(tag); if (cls) { e.className = cls; } return e; }

function carryRow(b, text, amt) {
    var tr = mk('tr', 'carry-row'), a = mk('td', 'text-right'), c = mk('td', 'text-right');
    a.colSpan = Math.max(1, b.cols - 1); a.textContent = text;
    c.textContent = typeof amt === 'number' ? inr(amt) : amt;
    tr.appendChild(a); tr.appendChild(c);
    return tr;
}

function measureTable(el) {
    var th = el.tHead, tf = el.tFoot;
    var b = {type: 'table', el: el, units: [],
             theadH: th ? th.getBoundingClientRect().height : 0,
             tfootH: tf ? tf.getBoundingClientRect().height : 0,
             carry: el.hasAttribute('data-carry'), cols: parseInt(el.getAttribute('data-cols') || '3', 10)};
    Array.prototype.forEach.call(el.tBodies, function (tb) {
        if (tb.classList.contains('unit')) {
            b.units.push({el: tb, h: tb.getBoundingClientRect().height, amt: numAttr(tb, 'data-amt')});
        } else {
            Array.prototype.forEach.call(tb.rows, function (tr) {
                b.units.push({el: tr, h: tr.getBoundingClientRect().height, amt: numAttr(tr, 'data-amt')});
            });
        }
    });
    var cs = getComputedStyle(el);
    var inner = b.theadH + b.tfootH + sum(b.units, function (u) { return u.h; });
    b.chrome = Math.max(0, el.getBoundingClientRect().height - inner) +
               (parseFloat(cs.marginBottom) || 0) + (parseFloat(cs.marginTop) || 0);
    b.cfH = b.bfH = 0;
    if (b.carry && el.tBodies.length) {
        var probe = carryRow(b, 'Carried forward to next page', 0);
        el.tBodies[0].appendChild(probe);
        b.cfH = b.bfH = probe.getBoundingClientRect().height;
        el.tBodies[0].removeChild(probe);
    }
    return b;
}

function measure(d) {
    doc.className = 'doc-src dens-' + d;
    var m = {blocks: [], headH: 0, runH: 0, d: d};
    Array.prototype.forEach.call(doc.children, function (el) {
        var part = el.getAttribute('data-part'), flow = el.getAttribute('data-flow');
        if (part === 'head') { m.headEl = el; m.headH = outerH(el); }
        else if (part === 'run') { m.runEl = el; m.runH = outerH(el); }
        else if (flow === 'table') { m.blocks.push(measureTable(el)); }
        else if (flow === 'block') { m.blocks.push({type: 'block', el: el, h: outerH(el)}); }
    });
    return m;
}

function layout(m, P) {
    var pages = [], cur, rem, cum = 0;

    function newPage() {
        cur = {items: [], fresh: true};
        pages.push(cur);
        if (pages.length === 1) { cur.items.push({k: 'head'}); rem = P - m.headH; }
        else { cur.items.push({k: 'run'}); rem = P - m.runH; }
    }
    function atomic(b) {
        if (b.h > rem && !cur.fresh) { newPage(); }
        cur.items.push({k: 'block', b: b}); cur.fresh = false; rem -= b.h;
    }

    newPage();
    var tables = m.blocks.filter(function (b) { return b.type === 'table'; });
    var lastT = tables.length ? tables[tables.length - 1] : null;
    var lastIdx = lastT ? m.blocks.indexOf(lastT) : -1;
    var closing = lastT ? m.blocks.slice(lastIdx + 1) : [];
    var closingH = sum(closing, function (c) { return c.h; });

    function placeTable(b, isLast) {
        var portion = null, n = b.units.length;
        function openCost() { return b.theadH + b.chrome + ((b.carry && cum > 0) ? b.bfH : 0); }
        function open() {
            portion = {k: 'table', b: b, units: [], bf: null, cf: null, tfoot: false};
            cur.items.push(portion); cur.fresh = false;
            if (b.carry && cum > 0) { portion.bf = cum; }
            rem -= openCost();
        }
        function close() {
            if (portion && b.carry && portion.units.length) { portion.cf = cum; rem -= b.cfH; }
            portion = null;
        }
        function put(u) { portion.units.push(u); rem -= u.h; cum += u.amt; }
        function placeUnits(units, finalIsEnd) {
            units.forEach(function (u, idx) {
                var isEnd = finalIsEnd && idx === units.length - 1;
                var reserve = isEnd ? b.tfootH : (b.carry ? b.cfH : 0);
                var need = u.h + reserve + (portion ? 0 : openCost());
                if (need > rem && !cur.fresh) { close(); newPage(); need = u.h + reserve + openCost(); }
                if (!portion) { open(); }
                put(u);
                if (isEnd) { portion.tfoot = true; rem -= b.tfootH; }
            });
        }

        var K = isLast ? Math.min(MIN_TAIL, n) : 0;
        placeUnits(b.units.slice(0, n - K), !isLast);

        if (isLast) {
            var tail = b.units.slice(n - K);
            var tailH = sum(tail, function (u) { return u.h; }) + b.tfootH + closingH;
            var need = tailH + (portion ? 0 : openCost());
            if (need > rem && (!cur.fresh || portion)) { close(); newPage(); need = tailH + openCost(); }
            if (need <= rem) {
                if (!portion) { open(); }
                tail.forEach(put);
                portion.tfoot = true; rem -= b.tfootH;
                closing.forEach(function (c) { cur.items.push({k: 'block', b: c}); rem -= c.h; });
            } else {
                placeUnits(tail, true);
                if (closingH > rem && !cur.fresh) { newPage(); }
                closing.forEach(function (c) { cur.items.push({k: 'block', b: c}); rem -= c.h; });
            }
        }
    }

    m.blocks.forEach(function (b, bi) {
        if (lastT && bi > lastIdx) { return; }
        if (b.type === 'block') { atomic(b); } else { placeTable(b, b === lastT); }
    });
    return pages;
}

function buildTable(it) {
    var b = it.b, t = b.el.cloneNode(false), tb = null;
    var cg = b.el.querySelector('colgroup');
    if (cg) { t.appendChild(cg.cloneNode(true)); }
    if (b.el.tHead) { t.appendChild(b.el.tHead.cloneNode(true)); }
    function body() { if (!tb) { tb = mk('tbody'); t.appendChild(tb); } return tb; }
    if (it.bf !== null) { body().appendChild(carryRow(b, 'Brought forward from previous page', it.bf)); }
    it.units.forEach(function (u) {
        if (u.el.tagName === 'TBODY') { t.appendChild(u.el.cloneNode(true)); tb = null; }
        else { body().appendChild(u.el.cloneNode(true)); }
    });
    if (it.cf !== null) { body().appendChild(carryRow(b, 'Carried forward to next page', it.cf)); }
    if (it.tfoot && b.el.tFoot) { t.appendChild(b.el.tFoot.cloneNode(true)); }
    return t;
}

function build(pick) {
    host.className = 'dens-' + pick.m.d;
    host.innerHTML = '';
    var total = pick.pages.length;
    pick.pages.forEach(function (pg, i) {
        var sheet = mk('div', 'sheet'), body = mk('div', 'sheet-body');
        sheet.appendChild(body);
        pg.items.forEach(function (it) {
            if (it.k === 'head') { body.appendChild(pick.m.headEl.cloneNode(true)); }
            else if (it.k === 'run') { if (pick.m.runEl) { body.appendChild(pick.m.runEl.cloneNode(true)); } }
            else if (it.k === 'block') { body.appendChild(it.b.el.cloneNode(true)); }
            else { body.appendChild(buildTable(it)); }
        });
        var foot = mk('div', 'sheet-foot');
        /* Challan label removed, showing only continuation message and page numbers */
        foot.innerHTML = '<span></span>' +
                         '<span class="cont">' + (i < total - 1 ? 'Continued on next page \u2192' : '') + '</span>' +
                         '<span>Page <b>' + (i + 1) + '</b> of <b>' + total + '</b></span>';
        sheet.appendChild(foot);
        host.appendChild(sheet);
        Array.prototype.forEach.call(sheet.querySelectorAll('[data-fill="page"]'), function (n) { n.textContent = i + 1; });
        Array.prototype.forEach.call(sheet.querySelectorAll('[data-fill="pages"]'), function (n) { n.textContent = total; });
    });
}

function overflowing() {
    var bad = false;
    Array.prototype.forEach.call(host.querySelectorAll('.sheet-body'), function (b) {
        if (b.scrollHeight - b.clientHeight > 1) { bad = true; }
    });
    return bad;
}

function capacity() {
    var s = mk('div', 'sheet'), b = mk('div', 'sheet-body');
    s.appendChild(b); s.appendChild(mk('div', 'sheet-foot'));
    host.appendChild(s);
    var h = b.clientHeight;
    host.removeChild(s);
    return h;
}

function fitZoom() {
    var avail = document.documentElement.clientWidth - 12, w = 793.7;
    host.style.zoom = avail < w ? String(avail / w) : '';
}

function run() {
    host.className = ''; host.innerHTML = '';
    var base = capacity();
    var results = DENS.map(function (d) { return {d: d, m: measure(d)}; });
    var pick = null;
    for (var t = 0; t <= MAX_TRIES; t++) {
        var P = base - safety;
        results.forEach(function (r) { r.pages = layout(r.m, P); });
        if (mode === 'auto') {
            var min = Math.min.apply(null, results.map(function (r) { return r.pages.length; }));
            pick = results.filter(function (r) { return r.pages.length === min; })[0];
        } else {
            pick = results.filter(function (r) { return r.d === mode; })[0];
        }
        build(pick);
        if (!overflowing()) { break; }
        safety += 6;
    }
    fitZoom();
    var info = document.getElementById('pageInfo');
    if (info) { info.textContent = pick.pages.length + (pick.pages.length === 1 ? ' page' : ' pages') + ' \u00b7 ' + DENS_NAME[pick.m.d]; }
    window.__printPages = pick.pages.length;
    window.__printDensity = pick.m.d;
}

function start() {
    try { run(); }
    catch (e) {
        if (window.console) { console.error('print engine failed', e); }
        document.documentElement.classList.remove('js');
        host.innerHTML = '';
    }
}

var sel = document.getElementById('densitySel');
if (sel) { sel.addEventListener('change', function () { mode = sel.value; safety = 0; start(); }); }
window.addEventListener('resize', fitZoom);
window.addEventListener('beforeprint', function () { host.style.zoom = ''; });
window.addEventListener('afterprint', fitZoom);

if (document.fonts && document.fonts.ready) { document.fonts.ready.then(start); } else { start(); }
window.PrintEngine = {relayout: start};
})();
</script>
