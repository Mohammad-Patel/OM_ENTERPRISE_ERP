<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Generate Monthly Bill - OM Enterprise</title>
<style>
body { font-family: sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 20px; }
.container { max-width: 600px; margin: auto; background: #fff; padding: 25px; border: 1px solid #cbd5e1; border-radius: 6px; }
h2 { margin-top: 0; border-bottom: 2px solid #0f172a; padding-bottom: 8px; }
.form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; }
label { font-weight: 700; font-size: 12px; color: #334155; }
input, select { padding: 9px; font-size: 13px; border: 1px solid #94a3b8; border-radius: 4px; }
.btn { background: #0f172a; color: #fff; padding: 10px 18px; border: none; border-radius: 4px; font-weight: 700; cursor: pointer; font-size: 14px; width: 100%; }
.btn:hover { background: #1e293b; }
</style>
</head>
<body>
<div class="container">
  <h2>Generate Monthly Tax Invoice</h2>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>Party:</label>
      <select name="party_id" required>
        <option value="">Select Party</option>
        {% for p in parties %}
        <option value="{{ p.Party_ID }}">{{ p.Party_Name or p.Name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label>Site:</label>
      <select name="site_id" required>
        <option value="">Select Site</option>
        {% for s in sites %}
        <option value="{{ s.Site_ID }}">{{ s.Site_Name or s.Address }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label>Start Date:</label>
      <input type="text" name="start_date" required placeholder="DD-MM-YYYY" value="01-08-2026">
    </div>

    <div class="form-group">
      <label>End Date:</label>
      <input type="text" name="end_date" required placeholder="DD-MM-YYYY" value="31-08-2026">
    </div>

    <button type="submit" class="btn">Generate Tax Invoice</button>
  </form>
</div>
</body>
</html>
